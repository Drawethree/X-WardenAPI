<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-Warden API — Builds</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161922;
    --line: #242936;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #5b9dff;
    --ok: #3fb950;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 40px 20px 80px; }

  .back { color: var(--muted); text-decoration: none; font-size: 13px; }
  .back:hover { color: var(--accent); }
  header { border-bottom: 1px solid var(--line); padding-bottom: 24px; margin: 10px 0 32px; }
  h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0; }
  .sub a { color: var(--muted); }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
       color: var(--muted); margin: 36px 0 14px; font-weight: 600; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }

  .latest { padding: 18px 20px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
  .latest .v { font-family: var(--mono); font-size: 20px; color: var(--ok); }
  .latest .meta { color: var(--muted); font-size: 13px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tab { background: none; border: 1px solid var(--line); color: var(--muted);
         padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; }
  .tab[aria-selected="true"] { color: var(--text); border-color: var(--accent); background: #1b2231; }

  pre { margin: 0; padding: 16px 18px; overflow-x: auto; font-family: var(--mono);
        font-size: 12.5px; line-height: 1.6; color: #c6cede; }
  .snip { position: relative; }
  .copy { position: absolute; top: 10px; right: 10px; background: #222836; border: 1px solid var(--line);
          color: var(--muted); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer;
          font-family: inherit; }
  .copy:hover { color: var(--text); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase;
       letter-spacing: 0.06em; color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--line); }
  td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .num { font-family: var(--mono); color: var(--muted); white-space: nowrap; }
  .msg { color: var(--text); }
  .msg .by { color: var(--muted); font-size: 12.5px; display: block; }
  .sha { font-family: var(--mono); font-size: 12.5px; color: var(--muted); text-decoration: none; }
  .sha:hover { color: var(--accent); }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 20px; border: 1px solid var(--line);
         color: var(--muted); white-space: nowrap; }
  .tag.rel { color: var(--ok); border-color: #23482c; }
  .dl { color: var(--accent); text-decoration: none; font-size: 13px; white-space: nowrap; }
  .dl:hover { text-decoration: underline; }
  .scroll { overflow-x: auto; }
  .empty { padding: 28px; color: var(--muted); text-align: center; }
  footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line);
           color: var(--muted); font-size: 13px; }
  footer a { color: var(--muted); }
  @media (max-width: 620px) { .hide-sm { display: none; } .wrap { padding-top: 28px; } }
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="/">← all projects</a>
  <header>
    <h1>X-Warden <span>API</span></h1>
    <p class="sub">Automatic builds of the
      <a href="https://github.com/Drawethree/X-WardenAPI">public API contract</a>
      for <a href="https://builtbybit.com/resources/x-warden-anti-cheat-anti-exploit.125374/">X-Warden</a>.</p>
  </header>

  <h2>Latest release</h2>
  <div class="panel latest" id="latest">
    <span class="meta">loading…</span>
  </div>

  <h2>Depend on it</h2>
  <div class="tabs" id="tabs">
    <button class="tab" data-kind="maven" aria-selected="true">Maven</button>
    <button class="tab" data-kind="gradle" aria-selected="false">Gradle (Groovy)</button>
    <button class="tab" data-kind="kts" aria-selected="false">Gradle (Kotlin)</button>
  </div>
  <div class="panel snip">
    <button class="copy" id="copy">Copy</button>
    <pre id="snippet">loading…</pre>
  </div>

  <h2>Builds</h2>
  <div class="panel scroll">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Commit</th>
          <th class="hide-sm">Version</th>
          <th class="hide-sm">Date</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="builds">
        <tr><td colspan="5" class="empty">loading…</td></tr>
      </tbody>
    </table>
  </div>

  <footer>
    Artifacts are provided as is, without warranty of any kind.
    Maven repository at <a href="https://repo.drawethree.dev">repo.drawethree.dev</a>.
  </footer>

</div>

<script>
const REPO = 'https://github.com/Drawethree/X-WardenAPI';
const GROUP = 'dev.drawethree.xwarden';
const ARTIFACT = 'X-WardenAPI';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// The snippet defaults to the newest release. Nobody should be told to depend on a
// snapshot by default, and there is no LATEST here - Maven 3 dropped it.
let version = null, channel = 'releases';

const snippets = {
  maven: () => `<repository>
    <id>drawethree</id>
    <url>https://repo.drawethree.dev/${channel}</url>
</repository>

<dependency>
    <groupId>${GROUP}</groupId>
    <artifactId>${ARTIFACT}</artifactId>
    <version>${version}</version>
    <scope>provided</scope>
</dependency>`,
  gradle: () => `repositories {
    maven { url 'https://repo.drawethree.dev/${channel}' }
}

dependencies {
    compileOnly '${GROUP}:${ARTIFACT}:${version}'
}`,
  kts: () => `repositories {
    maven("https://repo.drawethree.dev/${channel}")
}

dependencies {
    compileOnly("${GROUP}:${ARTIFACT}:${version}")
}`
};

let kind = 'maven';
const render = () => {
  document.getElementById('snippet').textContent =
    version ? snippets[kind]() : 'No published build yet.';
};

document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  kind = btn.dataset.kind;
  [...document.querySelectorAll('.tab')].forEach(t =>
    t.setAttribute('aria-selected', String(t === btn)));
  render();
});

document.getElementById('copy').addEventListener('click', async e => {
  try {
    await navigator.clipboard.writeText(document.getElementById('snippet').textContent);
    e.target.textContent = 'Copied';
    setTimeout(() => e.target.textContent = 'Copy', 1400);
  } catch { e.target.textContent = 'Copy failed'; }
});

const when = iso => {
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
};

fetch('builds.json', { cache: 'no-cache' })
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(builds => {
    if (!Array.isArray(builds) || !builds.length) throw 'empty';

    const release = builds.find(b => b.channel === 'releases');
    const shown = release || builds[0];
    version = shown.version;
    channel = shown.channel;

    document.getElementById('latest').innerHTML = release
      ? `<span class="v">${esc(release.version)}</span>
         <span class="meta">build #${esc(release.number)} · ${esc(when(release.date))}</span>
         <a class="dl" href="builds/${esc(release.number)}/${esc(release.file)}">Download jar</a>`
      : `<span class="meta">No tagged release yet — showing the latest snapshot,
         <span class="v" style="font-size:15px">${esc(shown.version)}</span>.</span>`;

    document.getElementById('builds').innerHTML = builds.map(b => `
      <tr>
        <td class="num">#${esc(b.number)}</td>
        <td class="msg">${esc(b.message)}
          <span class="by">${esc(b.author)} ·
            <a class="sha" href="${REPO}/commit/${esc(b.commit)}">${esc(b.short)}</a></span></td>
        <td class="hide-sm"><span class="tag ${b.channel === 'releases' ? 'rel' : ''}">${esc(b.version)}</span></td>
        <td class="hide-sm num">${esc(when(b.date))}</td>
        <td><a class="dl" href="builds/${esc(b.number)}/${esc(b.file)}">jar</a></td>
      </tr>`).join('');

    render();
  })
  .catch(() => {
    document.getElementById('latest').innerHTML =
      '<span class="meta">No builds published yet.</span>';
    document.getElementById('builds').innerHTML =
      '<tr><td colspan="5" class="empty">No builds published yet.</td></tr>';
    render();
  });
</script>
</body>
</html>
