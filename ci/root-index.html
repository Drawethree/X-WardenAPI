<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drawethree — Builds</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161922;
    --line: #242936;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #5b9dff;
    --ok: #3fb950;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 48px 20px 80px; }

  header { border-bottom: 1px solid var(--line); padding-bottom: 24px; margin-bottom: 32px; }
  h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0; }
  .sub a { color: var(--accent); text-decoration: none; }
  .sub a:hover { text-decoration: underline; }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
       color: var(--muted); margin: 0 0 14px; font-weight: 600; }

  .grid { display: grid; gap: 12px; }
  .card {
    display: block; text-decoration: none; color: inherit;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 20px; transition: border-color .12s ease;
  }
  .card:hover { border-color: var(--accent); }
  .card .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; }
  .card .name { font-size: 17px; font-weight: 600; }
  .card .coord { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .card .desc { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
  .card .stat { margin-top: 10px; font-size: 13px; color: var(--muted); font-family: var(--mono); }
  .card .stat .v { color: var(--ok); }

  footer { margin-top: 44px; padding-top: 20px; border-top: 1px solid var(--line);
           color: var(--muted); font-size: 13px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>drawethree <span>builds</span></h1>
    <p class="sub">Automatic builds of the public API contracts. Artifacts resolve from
      <a href="https://repo.drawethree.dev">repo.drawethree.dev</a>.</p>
  </header>

  <h2>Projects</h2>
  <div class="grid" id="grid"></div>

  <footer>
    Artifacts are provided as is, without warranty of any kind.
  </footer>

</div>

<script>
// Adding a project means adding a line here and creating its directory on the host.
// This page is uploaded by the X-WardenAPI workflow; see docs/PUBLISHING.md there.
const PROJECTS = [
  { slug: 'x-warden',       name: 'X-WardenAPI',      coord: 'dev.drawethree.xwarden:X-WardenAPI',
    desc: 'Report violations, read findings, write addons.' },
  { slug: 'x-prison',       name: 'X-PrisonAPI',      coord: 'dev.drawethree.xprison:X-PrisonAPI',
    desc: 'Ranks, mines, enchants, gangs and the rest of the X-Prison surface.' },
  { slug: 'x-privatemines', name: 'XPrivateMinesAPI', coord: 'dev.drawethree:XPrivateMinesAPI',
    desc: 'Private mine creation, geometry and block handling.' },
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const grid = document.getElementById('grid');
grid.innerHTML = PROJECTS.map(p => `
  <a class="card" href="${p.slug}/" id="card-${p.slug}">
    <div class="row">
      <span class="name">${esc(p.name)}</span>
      <span class="coord">${esc(p.coord)}</span>
    </div>
    <div class="desc">${esc(p.desc)}</div>
    <div class="stat" data-stat="${p.slug}">…</div>
  </a>`).join('');

// Each project's own builds.json is the source of truth for its latest version, so this
// page stays correct without anything having to write to it.
PROJECTS.forEach(p => {
  const el = document.querySelector(`[data-stat="${p.slug}"]`);
  fetch(`${p.slug}/builds.json`, { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(b => {
      if (!Array.isArray(b) || !b.length) throw 'empty';
      const rel = b.find(x => x.channel === 'releases');
      const shown = rel || b[0];
      el.innerHTML = `<span class="v">${esc(shown.version)}</span> · build #${esc(shown.number)}`
        + (rel ? '' : ' · snapshot');
    })
    .catch(() => { el.textContent = 'no builds yet'; });
});
</script>
</body>
</html>
